openapi: 3.0.0
info:
  title: AssetsLedger
  version: 1.0.0
  description: Abacus Assets Ledger entity API (parameterized subset for NSwag generation).
servers:
  - url: http://localhost
paths:
  /Assets:
    get:
      summary: List assets
      operationId: get_Assets
      tags:
        - Assets
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/ODataSelect'
        - $ref: '#/components/parameters/ODataTop'
        - $ref: '#/components/parameters/ODataOrderBy'
        - $ref: '#/components/parameters/ODataExpand'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollection'
        '400':
          description: Bad Request
        '500':
          description: Server Error
    post:
      summary: Create asset
      operationId: post_Assets
      tags:
        - Assets
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Successful
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /Assets({id}):
    get:
      summary: Get asset
      operationId: get_Assets_id
      tags:
        - Assets
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ODataExpand'
        - $ref: '#/components/parameters/ODataSelect'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
