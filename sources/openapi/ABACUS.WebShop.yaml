            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollection'
        '400':
          description: Bad Request
        '500':
          description: Server Error
    post:
      summary: Create shopper account
      operationId: post_ShopperAccounts
      tags:
        - ShopperAccounts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Successful
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /ShopperAccounts(Id={id}):
