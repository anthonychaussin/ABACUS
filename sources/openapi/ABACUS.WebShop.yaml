          description: Bad Request
        '500':
          description: Server Error
    patch:
      summary: Patch shopper account
      operationId: patch_ShopperAccounts_Id_id
      tags:
        - ShopperAccounts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Successful
        '400':
          description: Bad Request
        '500':
          description: Server Error
    delete:
      summary: Delete shopper account
      operationId: delete_ShopperAccounts_Id_id
      tags:
        - ShopperAccounts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful
        '204':
          description: No Content
        '400':
          description: Bad Request
        '500':
          description: Server Error
