      summary: Get shopper account
      operationId: get_ShopperAccounts_Id_id
      tags:
        - ShopperAccounts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ODataExpand'
