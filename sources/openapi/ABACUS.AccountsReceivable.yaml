components:
  parameters:
    ODataFilter:
      name: $filter
      in: query
      required: false
      schema:
        type: string
    ODataSelect:
      name: $select
      in: query
      required: false
      schema:
        type: string
    ODataTop:
      name: $top
      in: query
      required: false
      schema:
        type: integer
        maximum: 100
    ODataOrderBy:
      name: $orderby
      in: query
      required: false
      schema:
        type: string
    ODataExpand:
      name: $expand
      in: query
      required: false
      schema:
        type: string
  schemas:
    ODataCollection:
      type: object
      properties:
        value:
          type: array
          items:
            type: object
            additionalProperties: true
        '@odata.nextLink':
          type: string
          nullable: true
