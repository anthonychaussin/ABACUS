openapi: 3.0.0
info:
  title: ProductionPlanning
  version: 1.0.0
  description: Abacus Production Planning entity API (partial OpenAPI used for NSwag generation).
servers:
  - url: http://localhost
paths:
  /Resources:
    get:
      summary: List resources
      operationId: get_Resources
      tags: [Resources]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/ODataSelect'
        - $ref: '#/components/parameters/ODataTop'
        - $ref: '#/components/parameters/ODataOrderBy'
        - $ref: '#/components/parameters/ODataExpand'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollection'
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /Resources({id}):
    get:
      summary: Get resource
      operationId: get_Resources_id
      tags: [Resources]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ODataSelect'
        - $ref: '#/components/parameters/ODataExpand'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /ProductionOrderHeaders:
    get:
      summary: List production order headers
      operationId: get_ProductionOrderHeaders
      tags: [ProductionOrderHeaders]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/ODataSelect'
        - $ref: '#/components/parameters/ODataTop'
        - $ref: '#/components/parameters/ODataOrderBy'
        - $ref: '#/components/parameters/ODataExpand'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollection'
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /ProductionOrderHeaders({id}):
    get:
      summary: Get production order header
      operationId: get_ProductionOrderHeaders_id
      tags: [ProductionOrderHeaders]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /ProductionImportDatas:
    get:
      summary: List production import data
      operationId: get_ProductionImportDatas
      tags: [ProductionImportDatas]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/ODataTop'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollection'
        '400':
          description: Bad Request
        '500':
          description: Server Error
    post:
      summary: Create production import data
      operationId: post_ProductionImportDatas
      tags: [ProductionImportDatas]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Successful
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /ProductionExportDatas:
    get:
      summary: List production export data
      operationId: get_ProductionExportDatas
      tags: [ProductionExportDatas]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/ODataTop'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollection'
        '400':
          description: Bad Request
        '500':
          description: Server Error
components:
  parameters:
    ODataFilter:
      name: $filter
      in: query
      required: false
      schema:
        type: string
    ODataSelect:
      name: $select
      in: query
      required: false
      schema:
        type: string
    ODataTop:
      name: $top
      in: query
      required: false
      schema:
        type: integer
        maximum: 100
    ODataOrderBy:
      name: $orderby
      in: query
      required: false
      schema:
        type: string
    ODataExpand:
      name: $expand
      in: query
      required: false
      schema:
        type: string
  schemas:
    ODataCollection:
      type: object
      properties:
        value:
          type: array
          items:
            type: object
            additionalProperties: true
        '@odata.nextLink':
          type: string
          nullable: true
