openapi: 3.0.0
info:
  title: DossierFileUpload
  version: 1.0.0
  description: Abacus Dossier / file-store API (partial OpenAPI used for NSwag generation).
servers:
  - url: http://localhost
paths:
  /api/file-store/v1/user:
    post:
      summary: Upload file to user file-store
      operationId: post_api_file_store_v1_user
      tags: [FileStream]
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Successful
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /CustomerInvoiceDocuments:
    get:
      summary: List customer invoice documents
      operationId: get_CustomerInvoiceDocuments
      tags: [DossierFileUpload]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/ODataTop'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollection'
        '400':
          description: Bad Request
        '500':
          description: Server Error
    post:
      summary: Upload customer invoice document
      operationId: post_CustomerInvoiceDocuments
      tags: [DossierFileUpload]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Successful
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /Storages({id}):
    get:
      summary: Get storage
      operationId: get_Storages_id
      tags: [DossierFileUpload]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad Request
        '500':
          description: Server Error
components:
  parameters:
    ODataFilter:
      name: $filter
      in: query
      required: false
      schema:
        type: string
    ODataTop:
      name: $top
      in: query
      required: false
      schema:
        type: integer
        maximum: 100
  schemas:
    ODataCollection:
      type: object
      properties:
        value:
          type: array
          items:
            type: object
            additionalProperties: true
        '@odata.nextLink':
          type: string
          nullable: true
