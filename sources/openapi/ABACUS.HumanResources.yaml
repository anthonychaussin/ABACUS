openapi: 3.0.0
info:
  title: HumanResources
  version: 1.0.0
  description: Abacus Human Resources entity API (partial OpenAPI used for NSwag generation).
servers:
  - url: http://localhost
paths:
  /OrganisationEmployees:
    get:
      summary: List organisation employees
      operationId: get_OrganisationEmployees
      tags: [OrganisationEmployees]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/ODataSelect'
        - $ref: '#/components/parameters/ODataTop'
        - $ref: '#/components/parameters/ODataOrderBy'
        - $ref: '#/components/parameters/ODataExpand'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollection'
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /OrganisationEmployees({id}):
    get:
      summary: Get organisation employee
      operationId: get_OrganisationEmployees_id
      tags: [OrganisationEmployees]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /OrganisationOrgUnits:
    get:
      summary: List organisation org units
      operationId: get_OrganisationOrgUnits
      tags: [OrganisationOrgUnits]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/ODataTop'
        - $ref: '#/components/parameters/ODataOrderBy'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollection'
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /OrganisationOrgUnits({id}):
    get:
      summary: Get organisation org unit
      operationId: get_OrganisationOrgUnits_id
      tags: [OrganisationOrgUnits]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /Applicants:
    get:
      summary: List applicants
      operationId: get_Applicants
      tags: [Applicants]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/ODataTop'
        - $ref: '#/components/parameters/ODataOrderBy'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollection'
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /Applicants({id}):
    get:
      summary: Get applicant
      operationId: get_Applicants_id
      tags: [Applicants]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /LearningTrainings:
    get:
      summary: List learning trainings
      operationId: get_LearningTrainings
      tags: [LearningTrainings]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/ODataTop'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollection'
        '400':
          description: Bad Request
        '500':
          description: Server Error
    post:
      summary: Create learning training
      operationId: post_LearningTrainings
      tags: [LearningTrainings]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Successful
        '400':
          description: Bad Request
        '500':
          description: Server Error
components:
  parameters:
    ODataFilter:
      name: $filter
      in: query
      required: false
      schema:
        type: string
    ODataSelect:
      name: $select
      in: query
      required: false
      schema:
        type: string
    ODataTop:
      name: $top
      in: query
      required: false
      schema:
        type: integer
        maximum: 100
    ODataOrderBy:
      name: $orderby
      in: query
      required: false
      schema:
        type: string
    ODataExpand:
      name: $expand
      in: query
      required: false
      schema:
        type: string
  schemas:
    ODataCollection:
      type: object
      properties:
        value:
          type: array
          items:
            type: object
            additionalProperties: true
        '@odata.nextLink':
          type: string
          nullable: true
